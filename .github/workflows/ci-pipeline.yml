name: 🚀 TaskBuddy CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # JOB 1: VERIFICARE ȘI BUILD BACKEND (JAVA)
  # ==========================================
  backend-ci:
    name: ☕ Backend CI (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Check for Backend Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'TaskBuddy/**'
              - '.github/workflows/ci-pipeline.yml'

      - name: ☕ Set up JDK 21
        if: steps.filter.outputs.backend == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🔨 Build and Test Backend
        if: steps.filter.outputs.backend == 'true'
        run: |
          cd TaskBuddy
          chmod +x mvnw
          ./mvnw clean package

  # ==========================================
  # JOB 2: VERIFICARE ȘI BUILD FRONTEND (REACT)
  # ==========================================
  frontend-ci:
    name: ⚛️ Frontend CI (React & TS)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Check for Frontend Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'taskbuddy-frontend/**'
              - '.github/workflows/ci-pipeline.yml'

      - name: 🟢 Set up Node.js
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'taskbuddy-frontend/package-lock.json'

      - name: 📦 Install Dependencies
        if: steps.filter.outputs.frontend == 'true'
        run: |
          cd taskbuddy-frontend
          npm ci

      - name: 🔍 Run TypeScript Linter & Typecheck
        if: steps.filter.outputs.frontend == 'true'
        run: |
          cd taskbuddy-frontend
          npx tsc --noEmit

      - name: ⚡ Build Frontend Application
        if: steps.filter.outputs.frontend == 'true'
        run: |
          cd taskbuddy-frontend
          npm run build