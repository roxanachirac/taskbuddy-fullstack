name: 🚀 TaskBuddy CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # JOB 1: VERIFICARE ȘI BUILD BACKEND (JAVA)
  # ==========================================
  backend-ci:
    name: ☕ Backend CI (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Check for Backend Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'TaskBuddy/**'
              - '.github/workflows/ci-pipeline.yml'

      - name: ☕ Set up JDK 21
        if: steps.filter.outputs.backend == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'TaskBuddy/pom.xml'

      - name: 🔨 Build and Test Backend
        if: steps.filter.outputs.backend == 'true'
        run: |
          cd TaskBuddy
          mvn clean package

  # ==========================================
  # JOB 2: VERIFICARE ȘI BUILD FRONTEND (REACT)
  # ==========================================
  frontend-ci:
    name: ⚛️ Frontend CI (React & TS)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Check for Frontend Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'taskbuddy-frontend/**'
              - '.github/workflows/ci-pipeline.yml'

      - name: 🟢 Set up Node.js
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'taskbuddy-frontend/package-lock.json'

      - name: 📦 Install Dependencies
        if: steps.filter.outputs.frontend == 'true'
        run: |
          cd taskbuddy-frontend
          npm ci

      - name: 🔍 Run TypeScript Linter & Typecheck
        if: steps.filter.outputs.frontend == 'true'
        run: |
          cd taskbuddy-frontend
          npx tsc --noEmit

      - name: ⚡ Build Frontend Application
        if: steps.filter.outputs.frontend == 'true'
        run: |
          cd taskbuddy-frontend
          npm run build

  # ==========================================
  # JOB 3: VALIDARE IMAGINI DOCKER (NOU)
  # ==========================================
  docker-build-ci:
    name: 🐳 Docker Build Verification
    runs-on: ubuntu-latest
    environment: Test # Sursa pentru Environment Secrets în GitHub

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      # Verificăm dacă s-a schimbat ceva în proiect sau în fișierele Docker
      - name: 🔍 Check for Changes Affecting Docker
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docker:
              - 'TaskBuddy/**'
              - 'taskbuddy-frontend/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci-pipeline.yml'

      - name: 🛠️ Set up Docker Buildx
        if: steps.filter.outputs.docker == 'true'
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build Test - Backend Docker Image
        if: steps.filter.outputs.docker == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./TaskBuddy
          push: false
          build-args: |
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}

      - name: 🐳 Build Test - Frontend Docker Image
        if: steps.filter.outputs.docker == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./taskbuddy-frontend
          push: false

  # ==========================================
  # JOB 4: PLAYWRIGHT E2E TESTS
  # ==========================================
  e2e-tests:
    name: 🎭 Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: always() && needs.backend-ci.result == 'success' && needs.frontend-ci.result == 'success'

    # PostgreSQL service container (disponibil pe localhost:5432)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskbuddy
          POSTGRES_USER: taskbuddy
          POSTGRES_PASSWORD: taskbuddy
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Check for Frontend Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'taskbuddy-frontend/**'
              - '.github/workflows/ci-pipeline.yml'

      - name: 🟢 Set up Node.js
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'taskbuddy-frontend/package-lock.json'

      - name: 📦 Install Frontend Dependencies
        if: steps.filter.outputs.frontend == 'true'
        run: |
          cd taskbuddy-frontend
          npm ci

      - name: 🎭 Install Playwright Browsers
        if: steps.filter.outputs.frontend == 'true'
        run: |
          cd taskbuddy-frontend
          npx playwright install --with-deps chromium

      - name: ☕ Set up JDK 21 (for Backend API)
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'TaskBuddy/pom.xml'

      - name: 🔨 Build Backend
        if: steps.filter.outputs.frontend == 'true'
        run: |
          cd TaskBuddy
          mvn clean package -DskipTests

      - name: 🚀 Start Backend Server (CI profile)
        if: steps.filter.outputs.frontend == 'true'
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: taskbuddy
          DB_USERNAME: taskbuddy
          DB_PASSWORD: taskbuddy
          OPENAI_API_KEY: dummy-key-for-ci
        run: |
          cd TaskBuddy
          java -jar target/taskbuddy-0.0.1-SNAPSHOT.jar --spring.profiles.active=ci > backend.log 2>&1 &
          BACKEND_PID=$!
          # Așteptăm ca backend-ul să fie gata
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8080/actuator/health; then
              echo "✅ Backend is ready"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
            # Dacă procesul a murit, ieșim cu eroare
            if ! kill -0 $BACKEND_PID 2>/dev/null; then
              echo "❌ Backend process died. Last 50 lines of log:"
              tail -50 backend.log
              exit 1
            fi
          done
          # Verificăm că loop-ul a ieșit pe break (backend ready), nu pe exhaust
          if ! curl -s -o /dev/null http://localhost:8080/actuator/health; then
            echo "❌ Backend failed to start within 60s. Full log:"
            cat backend.log
            exit 1
          fi

      - name: 🎭 Run Playwright E2E Tests
        if: steps.filter.outputs.frontend == 'true'
        env:
          VITE_API_BASE_URL: http://localhost:8080/api
        run: |
          cd taskbuddy-frontend
          npx playwright test --reporter=list

      - name: 📸 Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: taskbuddy-frontend/playwright-report/
          retention-days: 30


  # ==========================================
  # JOB 5: DEPLOY TO TEST (GCP activ; AWS + Azure comentate)
  # Fiecare cloud folosește REGISTRY-UL NATIV:
  #   AWS   -> ECR (comentat — fără cont configurat)
  #   GCP   -> Artifact Registry (ACTIV)
  #   Azure -> ACR (comentat — fără cont configurat)
  # ==========================================
  deploy-test:
    name: 🚀 Deploy to Test (GCP)
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: Test
    # OIDC: fără id-token: write GitHub nu injectează ACTIONS_ID_TOKEN_REQUEST_*
    # și google-github-actions/auth nu poate cere token-ul către GCP.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ==========================================
      # PART A — AWS: login ECR -> build & push -> deploy ECS
      # COMENTAT: nu avem cont AWS configurat. Se decomentează
      # când secretele AWS_* există în environment-ul Test.
      # ==========================================
      # - name: 🔐 AWS — Configure Credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-region: ${{ secrets.AWS_REGION }}
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #
      # - name: 🔐 AWS — Login to ECR
      #   id: ecr-login
      #   uses: aws-actions/amazon-ecr-login@v2
      #
      # - name: 🐳 AWS — Build & Push Backend to ECR
      #   uses: docker/build-push-action@v5
