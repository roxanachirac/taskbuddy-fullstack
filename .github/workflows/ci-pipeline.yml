name: 🚀 TaskBuddy CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # JOB 1: VERIFICARE ȘI BUILD BACKEND (JAVA)
  # ==========================================
  backend-ci:
    name: ☕ Backend CI (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Check for Backend Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'TaskBuddy/**'
              - '.github/workflows/ci-pipeline.yml'

      - name: ☕ Set up JDK 21
        if: steps.filter.outputs.backend == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'TaskBuddy/pom.xml'

      - name: 🔨 Build and Test Backend
        if: steps.filter.outputs.backend == 'true'
        run: |
          cd TaskBuddy
          mvn clean package

  # ==========================================
  # JOB 2: VERIFICARE ȘI BUILD FRONTEND (REACT)
  # ==========================================
  frontend-ci:
    name: ⚛️ Frontend CI (React & TS)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Check for Frontend Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'taskbuddy-frontend/**'
              - '.github/workflows/ci-pipeline.yml'

      - name: 🟢 Set up Node.js
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'taskbuddy-frontend/package-lock.json'

      - name: 📦 Install Dependencies
        if: steps.filter.outputs.frontend == 'true'
        run: |
          cd taskbuddy-frontend
          npm ci

      - name: 🔍 Run TypeScript Linter & Typecheck
        if: steps.filter.outputs.frontend == 'true'
        run: |
          cd taskbuddy-frontend
          npx tsc --noEmit

      - name: ⚡ Build Frontend Application
        if: steps.filter.outputs.frontend == 'true'
        run: |
          cd taskbuddy-frontend
          npm run build

  # ==========================================
  # JOB 3: VALIDARE IMAGINI DOCKER (NOU)
  # ==========================================
  docker-build-ci:
    name: 🐳 Docker Build Verification
    runs-on: ubuntu-latest
    environment: Test # Sursa pentru Environment Secrets în GitHub

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      # Verificăm dacă s-a schimbat ceva în proiect sau în fișierele Docker
      - name: 🔍 Check for Changes Affecting Docker
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docker:
              - 'TaskBuddy/**'
              - 'taskbuddy-frontend/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci-pipeline.yml'

      - name: 🛠️ Set up Docker Buildx
        if: steps.filter.outputs.docker == 'true'
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build Test - Backend Docker Image
        if: steps.filter.outputs.docker == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./TaskBuddy
          push: false
          build-args: |
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}

      - name: 🐳 Build Test - Frontend Docker Image
        if: steps.filter.outputs.docker == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./taskbuddy-frontend
          push: false

  # ==========================================
  # JOB 4: PLAYWRIGHT E2E TESTS
  # ==========================================
  e2e-tests:
    name: 🎭 Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: always() && needs.backend-ci.result == 'success' && needs.frontend-ci.result == 'success'

    # PostgreSQL service container (disponibil pe localhost:5432)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskbuddy
          POSTGRES_USER: taskbuddy
          POSTGRES_PASSWORD: taskbuddy
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Check for Frontend Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'taskbuddy-frontend/**'
              - '.github/workflows/ci-pipeline.yml'

      - name: 🟢 Set up Node.js
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'taskbuddy-frontend/package-lock.json'

      - name: 📦 Install Frontend Dependencies
        if: steps.filter.outputs.frontend == 'true'
        run: |
          cd taskbuddy-frontend
          npm ci

      - name: 🎭 Install Playwright Browsers
        if: steps.filter.outputs.frontend == 'true'
        run: |
          cd taskbuddy-frontend
          npx playwright install --with-deps chromium

      - name: ☕ Set up JDK 21 (for Backend API)
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'TaskBuddy/pom.xml'

      - name: 🔨 Build Backend
        if: steps.filter.outputs.frontend == 'true'
        run: |
          cd TaskBuddy
          mvn clean package -DskipTests

      - name: 🚀 Start Backend Server (CI profile)
        if: steps.filter.outputs.frontend == 'true'
        run: |
          java -jar TaskBuddy/target/TaskBuddy-0.0.1-SNAPSHOT.jar --spring.profiles.active=ci &
          # Așteptăm ca backend-ul să fie gata
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/tasks | grep -q "200"; then
              echo "✅ Backend is ready"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done

      - name: 🎭 Run Playwright E2E Tests
        if: steps.filter.outputs.frontend == 'true'
        env:
          VITE_API_BASE_URL: http://localhost:8080/api
        run: |
          cd taskbuddy-frontend
          npx playwright test --reporter=list

      - name: 📸 Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: taskbuddy-frontend/playwright-report/
          retention-days: 30