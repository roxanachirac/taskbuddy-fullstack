name: 🚀 TaskBuddy CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # JOB 1: VERIFICARE ȘI BUILD BACKEND (JAVA)
  # ==========================================
  backend-ci:
    name: ☕ Backend CI (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Check for Backend Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'TaskBuddy/**'
              - '.github/workflows/ci-pipeline.yml'

      - name: ☕ Set up JDK 21
        if: steps.filter.outputs.backend == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'TaskBuddy/pom.xml'

      - name: 🔨 Build and Test Backend
        if: steps.filter.outputs.backend == 'true'
        run: |
          cd TaskBuddy
          mvn clean package

  # ==========================================
  # JOB 2: VERIFICARE ȘI BUILD FRONTEND (REACT)
  # ==========================================
  frontend-ci:
    name: ⚛️ Frontend CI (React & TS)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Check for Frontend Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'taskbuddy-frontend/**'
              - '.github/workflows/ci-pipeline.yml'

      - name: 🟢 Set up Node.js
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'taskbuddy-frontend/package-lock.json'

      - name: 📦 Install Dependencies
        if: steps.filter.outputs.frontend == 'true'
        run: |
          cd taskbuddy-frontend
          npm ci

      - name: 🔍 Run TypeScript Linter & Typecheck
        if: steps.filter.outputs.frontend == 'true'
        run: |
          cd taskbuddy-frontend
          npx tsc --noEmit

      - name: ⚡ Build Frontend Application
        if: steps.filter.outputs.frontend == 'true'
        run: |
          cd taskbuddy-frontend
          npm run build

  # ==========================================
  # JOB 3: VALIDARE IMAGINI DOCKER (NOU)
  # ==========================================
  docker-build-ci:
    name: 🐳 Docker Build Verification
    runs-on: ubuntu-latest
    environment: Test # Sursa pentru Environment Secrets în GitHub

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      # Verificăm dacă s-a schimbat ceva în proiect sau în fișierele Docker
      - name: 🔍 Check for Changes Affecting Docker
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docker:
              - 'TaskBuddy/**'
              - 'taskbuddy-frontend/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci-pipeline.yml'

      - name: 🛠️ Set up Docker Buildx
        if: steps.filter.outputs.docker == 'true'
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build Test - Backend Docker Image
        if: steps.filter.outputs.docker == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./TaskBuddy
          push: false
          build-args: |
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}

      - name: 🐳 Build Test - Frontend Docker Image
        if: steps.filter.outputs.docker == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./taskbuddy-frontend
          push: false