services:
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - /media/roxana/Data/Projects/taskbuddy-fullstack-docker/postgresql/data:/var/lib/postgresql/data
