# CI/CD config - GitHub Actions cu PostgreSQL service container
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskbuddy}
spring.datasource.username=${DB_USERNAME:taskbuddy}
spring.datasource.password=${DB_PASSWORD:taskbuddy}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.threads.virtual.enabled=true
spring.ai.openai.api-key=${OPENAI_API_KEY:dummy-key-for-ci}
spring.ai.openai.chat.options.model=gpt-3.5-turbo
