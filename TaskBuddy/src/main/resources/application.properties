# Configurația conexiunii la baza de date
spring.datasource.url=jdbc:postgresql://localhost:5433/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate/JPA setări
# "update" înseamnă că Spring va crea automat tabelele în baza de date pe baza claselor noastre de Java!
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.threads.virtual.enabled=true
spring.ai.openai.api-key=${OPENAI_API_KEY}